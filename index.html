<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather</title>
<style>
  :root{
    --ink:#1b2733;
    --ink-soft:#5b6b78;
    --line:#e2e7eb;
    --panel:#ffffff;
    --page:#f4f6f8;
    --blue:#0b5fa5;
    --brand-dark:#2a2a2a;
    --sun:#f0a93c;
    --rain:#3d84c9;
    --heat-1:#ffe9b3;
    --heat-2:#ffd27a;
    --heat-3:#ffb84d;
    --heat-4:#ff9d3d;
    --heat-5:#ff7f3d;
    --uv-low:#4c9a4c;
    --uv-mod:#e0c72e;
    --uv-high:#e08a2e;
    --uv-vhigh:#d94f4f;
    --uv-extreme:#9b4fd9;
    --radius:10px;
    --colw:58px;
    --font: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--page);color:var(--ink);font-family:var(--font);}
  a{color:var(--blue);}

  .brand-bar{background:var(--brand-dark);color:#fff;padding:10px 16px;font-size:15px;font-weight:600;letter-spacing:.3px;}

  /* ---------- Search header ---------- */
  .searchbar{position:relative;max-width:1200px;margin:0 auto;padding:14px 16px;}
  .searchbar input{
    width:100%;padding:14px 44px 14px 16px;font-size:17px;
    border:1px solid var(--line);border-radius:8px;background:#fff;
    font-family:var(--font);color:var(--ink);
  }
  .searchbar input:focus{outline:2px solid var(--blue);outline-offset:-1px;}
  .search-icon{position:absolute;right:32px;top:50%;transform:translateY(-50%);
    width:20px;height:20px;color:var(--ink-soft);pointer-events:none;}
  .suggestions{
    position:absolute;left:16px;right:16px;top:64px;background:#fff;
    border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);
    max-height:320px;overflow-y:auto;z-index:50;display:none;
  }
  .suggestions.show{display:block;}
  .suggestion{padding:12px 16px;cursor:pointer;font-size:15px;border-bottom:1px solid var(--line);}
  .suggestion:last-child{border-bottom:none;}
  .suggestion:hover, .suggestion.active{background:#eef4fa;}
  .suggestion small{display:block;color:var(--ink-soft);font-size:12.5px;margin-top:2px;}

  /* ---------- Hero ---------- */
  .hero-wrap{max-width:1200px;margin:0 auto;padding:0 16px;}
  .hero-image{
    height:150px;border-radius:var(--radius) var(--radius) 0 0;overflow:hidden;
    background:linear-gradient(135deg,#7fb3d9,#2c6a9e 55%,#154a75);
  }
  .hero-image svg{width:100%;height:100%;display:block;}
  .hero-title{background:var(--panel);padding:16px 20px 4px;font-size:24px;font-weight:600;}
  h1.hero-title{margin:0;}

  .section-label{max-width:1200px;margin:18px auto 6px;padding:0 16px;font-size:19px;font-weight:600;}

  .day-strip{
    max-width:1200px;margin:0 auto;background:var(--panel);border-radius:var(--radius);
    display:flex;gap:0;padding:12px 8px 16px;overflow-x:auto;
  }
  .day-chip{
    flex:0 0 96px;text-align:center;padding:10px 6px;cursor:pointer;border-radius:8px;
  }
  .day-chip:hover{background:#f2f6f9;}
  .day-chip .dname{font-size:13.5px;color:var(--ink-soft);}
  .day-chip .dicon{margin:4px auto;width:32px;height:32px;}
  .day-chip .dtemp{font-size:15px;}
  .day-chip .dtemp .lo{color:var(--ink-soft);}
  .day-chip.selected{background:#eaf2fa;}

  .detail-panel{
    flex:0 0 300px;background:#fff;border:1px solid var(--line);
    border-radius:10px;margin:0 8px;padding:12px 16px;display:flex;flex-direction:column;gap:6px;
  }
  .detail-panel .dtitle{font-size:19px;font-weight:600;}
  .detail-panel .dtemps{font-size:32px;font-weight:600;}
  .detail-panel .dtemps .lo{font-size:19px;color:var(--ink-soft);font-weight:400;margin-left:6px;}
  .detail-panel .dsummary{font-size:13.5px;color:var(--ink-soft);}
  .detail-panel .dsun{font-size:12.5px;color:var(--ink-soft);display:flex;gap:16px;margin-top:2px;flex-wrap:wrap;}
  .chips{display:flex;gap:12px;margin-top:6px;flex-wrap:wrap;}
  .chip{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-soft);}
  .badge{color:#fff;font-weight:700;font-size:11.5px;display:flex;align-items:center;justify-content:center;}
  .badge.sq{width:20px;height:20px;border-radius:3px;}
  .badge.diamond{width:20px;height:20px;transform:rotate(45deg);border-radius:3px;}
  .badge.diamond span{transform:rotate(-45deg);display:block;}
  .badge.circle{width:20px;height:20px;border-radius:50%;}

  /* ---------- Hourly table ---------- */
  .table-wrap{max-width:1200px;margin:16px auto 40px;padding:0 16px;position:relative;}
  .table-scroller-outer{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  .nav-btn{
    position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;
    background:rgba(30,40,50,.55);color:#fff;border:none;cursor:pointer;font-size:18px;z-index:20;
    display:flex;align-items:center;justify-content:center;
  }
  .nav-btn.prev{left:22px;} .nav-btn.next{right:22px;}
  .nav-btn:hover{background:rgba(30,40,50,.8);}

  .table-flex{display:flex;}
  .row-labels-grid{display:flex;flex-direction:column;width:190px;flex:0 0 190px;background:#fafbfc;border-right:1px solid var(--line);}
  .row-label{
    font-size:12.5px;font-weight:600;color:var(--ink-soft);padding:0 12px;
    white-space:nowrap;border-bottom:1px solid var(--line);display:flex;align-items:center;height:40px;gap:6px;
  }
  .row-label select{font-size:11px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink-soft);}
  .day-banner-row{height:32px;}

  .scroll-outer{overflow-x:auto;position:relative;}
  .hgrid{display:flex;position:relative;padding-top:32px;}
  .hgrid::-webkit-scrollbar{height:8px;}
  .hgrid::-webkit-scrollbar-thumb{background:#ccc;border-radius:4px;}
  .day-banner{
    position:absolute;top:0;left:0;height:32px;display:flex;align-items:center;
    padding-left:8px;font-size:13px;font-weight:600;color:var(--ink);
    border-bottom:1px solid var(--line);border-left:2px solid var(--blue);background:#f7fafc;
  }
  .col{display:flex;flex-direction:column;flex:0 0 var(--colw);width:var(--colw);}
  .col .row{
    height:40px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line);
    font-size:12.5px;text-align:center;
  }
  .hour-head{font-size:12px;font-weight:600;color:var(--ink-soft);}
  .wx-icon{width:24px;height:24px;}
  .heat-cell{font-weight:600;width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
  .wind-cell{display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.1;}
  .wind-arrow{display:inline-block;font-size:12px;}
  .uv-pill{
    display:inline-flex;align-items:center;justify-content:center;width:20px;height:18px;
    border-radius:4px;color:#fff;font-weight:700;font-size:11px;
  }

  footer{max-width:1200px;margin:0 auto 40px;padding:0 16px;font-size:12.5px;color:var(--ink-soft);}
  .loading, .error{max-width:1200px;margin:40px auto;padding:0 16px;color:var(--ink-soft);font-size:15px;text-align:center;}
</style>
</head>
<body>

  <div class="brand-bar">Weather</div>

  <div class="searchbar">
    <input id="searchInput" type="text" placeholder="Search for a place" autocomplete="off">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <div id="suggestions" class="suggestions"></div>
  </div>

  <div id="app">
    <div class="loading">Search for a place to see its forecast.</div>
  </div>

  <footer>Weather data from <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a>, sourced from national meteorological services (Met Office UKMO model for the UK, ECMWF / national models elsewhere). Not an official Met Office product — a self-hosted layout inspired by their classic forecast page.</footer>

<script>
const APP = document.getElementById('app');
const searchInput = document.getElementById('searchInput');
const suggestionsBox = document.getElementById('suggestions');

let selectedDayIdx = 0;
let currentData = null;
let units = { temp:'C', wind:'mph', vis:'desc' };

// ---------------- Weather code mapping (WMO codes used by Open-Meteo) ----------------
function wxInfo(code, isDay){
  const day = isDay !== false;
  const table = {
    0:  {text:'Clear', icon:'sun'},
    1:  {text:'Mainly clear', icon: day?'sun-cloud':'moon-cloud'},
    2:  {text:'Partly cloudy', icon: day?'sun-cloud':'moon-cloud'},
    3:  {text:'Cloudy', icon:'cloud'},
    45: {text:'Fog', icon:'fog'},
    48: {text:'Freezing fog', icon:'fog'},
    51: {text:'Light drizzle', icon:'drizzle'},
    53: {text:'Drizzle', icon:'drizzle'},
    55: {text:'Heavy drizzle', icon:'drizzle'},
    56: {text:'Freezing drizzle', icon:'drizzle'},
    57: {text:'Freezing drizzle', icon:'drizzle'},
    61: {text:'Light rain', icon: day?'sun-rain':'rain'},
    63: {text:'Rain', icon:'rain'},
    65: {text:'Heavy rain', icon:'rain-heavy'},
    66: {text:'Freezing rain', icon:'rain'},
    67: {text:'Freezing rain', icon:'rain-heavy'},
    71: {text:'Light snow', icon:'snow'},
    73: {text:'Snow', icon:'snow'},
    75: {text:'Heavy snow', icon:'snow'},
    77: {text:'Snow grains', icon:'snow'},
    80: {text:'Light showers', icon: day?'sun-rain':'rain'},
    81: {text:'Showers', icon:'rain'},
    82: {text:'Heavy showers', icon:'rain-heavy'},
    85: {text:'Snow showers', icon:'snow'},
    86: {text:'Heavy snow showers', icon:'snow'},
    95: {text:'Thunderstorm', icon:'storm'},
    96: {text:'Thunderstorm, hail', icon:'storm'},
    99: {text:'Thunderstorm, heavy hail', icon:'storm'}
  };
  return table[code] || {text:'Overcast', icon:'cloud'};
}

function wxIconSVG(kind, size){
  size = size || 24;
  const sunCol = '#f0a93c', cloudCol='#9fb3c2', cloudColDark='#7c8f9d', rainCol='#3d84c9', snowCol='#8fa6ba';
  const icons = {
    sun: `<circle cx="12" cy="12" r="5" fill="${sunCol}"/><g stroke="${sunCol}" stroke-width="1.6" stroke-linecap="round">
      <line x1="12" y1="1.5" x2="12" y2="4.2"/><line x1="12" y1="19.8" x2="12" y2="22.5"/>
      <line x1="1.5" y1="12" x2="4.2" y2="12"/><line x1="19.8" y1="12" x2="22.5" y2="12"/>
      <line x1="4.3" y1="4.3" x2="6.2" y2="6.2"/><line x1="17.8" y1="17.8" x2="19.7" y2="19.7"/>
      <line x1="4.3" y1="19.7" x2="6.2" y2="17.8"/><line x1="17.8" y1="6.2" x2="19.7" y2="4.3"/></g>`,
    'sun-cloud': `<circle cx="9" cy="9" r="4.3" fill="${sunCol}"/><ellipse cx="14" cy="15" rx="7.5" ry="5" fill="${cloudCol}"/>`,
    'moon-cloud': `<path d="M8 6a5 5 0 1 0 5.3 6.9A5.6 5.6 0 0 1 8 6z" fill="#7c8fa3"/><ellipse cx="14" cy="15" rx="7.5" ry="5" fill="${cloudCol}"/>`,
    cloud: `<ellipse cx="12" cy="13.5" rx="8.5" ry="5.6" fill="${cloudColDark}"/>`,
    fog: `<g stroke="${cloudColDark}" stroke-width="2" stroke-linecap="round">
      <line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="13" x2="21" y2="13"/><line x1="3" y1="17" x2="21" y2="17"/></g>`,
    drizzle: `<ellipse cx="12" cy="10" rx="8" ry="5" fill="${cloudCol}"/>
      <g stroke="${rainCol}" stroke-width="1.6" stroke-linecap="round"><line x1="9" y1="17" x2="8" y2="20"/><line x1="15" y1="17" x2="14" y2="20"/></g>`,
    'sun-rain': `<circle cx="8" cy="8" r="3.6" fill="${sunCol}"/><ellipse cx="14" cy="13" rx="7" ry="4.6" fill="${cloudCol}"/>
      <g stroke="${rainCol}" stroke-width="1.6" stroke-linecap="round"><line x1="12" y1="19" x2="11" y2="22"/><line x1="16" y1="19" x2="15" y2="22"/></g>`,
    rain: `<ellipse cx="12" cy="10" rx="8" ry="5.2" fill="${cloudColDark}"/>
      <g stroke="${rainCol}" stroke-width="1.8" stroke-linecap="round"><line x1="8" y1="17" x2="7" y2="21"/><line x1="12" y1="17" x2="11" y2="21"/><line x1="16" y1="17" x2="15" y2="21"/></g>`,
    'rain-heavy': `<ellipse cx="12" cy="9" rx="8.5" ry="5.4" fill="${cloudColDark}"/>
      <g stroke="${rainCol}" stroke-width="2" stroke-linecap="round"><line x1="7" y1="16" x2="5.5" y2="21"/><line x1="12" y1="16" x2="10.5" y2="21"/><line x1="17" y1="16" x2="15.5" y2="21"/></g>`,
    snow: `<ellipse cx="12" cy="9" rx="8" ry="5" fill="${cloudCol}"/>
      <g fill="${snowCol}"><circle cx="8" cy="18" r="1.3"/><circle cx="12" cy="20" r="1.3"/><circle cx="16" cy="18" r="1.3"/></g>`,
    storm: `<ellipse cx="12" cy="9" rx="8.5" ry="5.2" fill="${cloudColDark}"/><polygon points="13,14 9,20 12,20 10,24 16,17 13,17" fill="#e0b23c"/>`
  };
  return `<svg class="wx-icon" width="${size}" height="${size}" viewBox="0 0 24 24">${icons[kind] || icons.cloud}</svg>`;
}

function heroSceneSVG(){
  return `<svg viewBox="0 0 1200 150" preserveAspectRatio="none">
    <rect width="1200" height="150" fill="url(#g1)"/>
    <defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fc1e8"/><stop offset="0.6" stop-color="#3f80b0"/><stop offset="1" stop-color="#1c4d78"/>
    </linearGradient></defs>
    <circle cx="1040" cy="40" r="26" fill="#ffe8ad" opacity="0.9"/>
    <path d="M0,120 C150,95 300,130 450,105 C600,85 750,125 900,100 C1000,88 1100,115 1200,95 L1200,150 L0,150 Z" fill="#2c688f" opacity="0.6"/>
    <path d="M0,140 C200,122 400,145 600,128 C800,112 1000,140 1200,128 L1200,150 L0,150 Z" fill="#194a6e"/>
  </svg>`;
}

// ---------------- Unit helpers ----------------
function compass(deg){
  const dirs=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
  return dirs[Math.round(deg/22.5) % 16];
}
function windArrowChar(deg){
  const arrows = ['↓','↙','↙','↙','←','↖','↖','↖','↑','↗','↗','↗','→','↘','↘','↘'];
  return arrows[Math.round(deg/22.5) % 16];
}
function fmtDate(d){ return d.toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short'}); }
function fmtDateLong(d){ return d.toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'long', year:'numeric'}); }

function toF(c){ return c * 9/5 + 32; }
function mphTo(v, unit){
  switch(unit){
    case 'mph': return Math.round(v);
    case 'kmh': return Math.round(v * 1.60934);
    case 'kn':  return Math.round(v * 0.868976);
    case 'ms':  return Math.round(v * 0.44704 * 10)/10;
    case 'bft': return mphToBeaufort(v);
  }
}
function mphToBeaufort(mph){
  const thresholds = [1,4,8,13,19,25,32,39,47,55,64,73];
  for(let i=0;i<thresholds.length;i++){ if(mph < thresholds[i]) return i; }
  return 12;
}
function windUnitLabel(u){ return {mph:'mph',kmh:'km/h',kn:'kn',ms:'m/s',bft:'Bft'}[u]; }

function visBand(meters){
  if(meters >= 40000) return 'E';
  if(meters >= 20000) return 'VG';
  if(meters >= 10000) return 'G';
  if(meters >= 4000) return 'M';
  if(meters >= 1000) return 'P';
  return 'VP';
}

function uvBand(uv){
  if(uv==null) return {label:'-', color:'#999'};
  if(uv<3) return {label:'L', color:'var(--uv-low)'};
  if(uv<6) return {label:'M', color:'var(--uv-mod)'};
  if(uv<8) return {label:'H', color:'var(--uv-high)'};
  if(uv<11) return {label:'VH', color:'var(--uv-vhigh)'};
  return {label:'EX', color:'var(--uv-extreme)'};
}
function aqiBand(aqi){
  if(aqi==null) return {label:'-', color:'#999'};
  if(aqi<=40) return {label:'L', color:'var(--uv-low)'};
  if(aqi<=80) return {label:'M', color:'var(--uv-mod)'};
  if(aqi<=100) return {label:'H', color:'var(--uv-high)'};
  return {label:'VH', color:'var(--uv-vhigh)'};
}
function heatColor(t){
  if(t==null) return '';
  if(t<8) return '';
  if(t<14) return 'var(--heat-1)';
  if(t<18) return 'var(--heat-2)';
  if(t<23) return 'var(--heat-3)';
  if(t<27) return 'var(--heat-4)';
  return 'var(--heat-5)';
}

// ---------------- Geocoding search ----------------
let searchTimer = null;
searchInput.addEventListener('input', () => {
  clearTimeout(searchTimer);
  const q = searchInput.value.trim();
  if(q.length < 2){ suggestionsBox.classList.remove('show'); return; }
  searchTimer = setTimeout(() => doSearch(q), 250);
});
document.addEventListener('click', (e) => {
  if(!e.target.closest('.searchbar')) suggestionsBox.classList.remove('show');
});

async function doSearch(q){
  try{
    const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=8&language=en&format=json`;
    const res = await fetch(url);
    const data = await res.json();
    renderSuggestions(data.results || []);
  }catch(err){ suggestionsBox.classList.remove('show'); }
}

function renderSuggestions(results){
  if(!results.length){ suggestionsBox.classList.remove('show'); return; }
  suggestionsBox.innerHTML = results.map((r,i) => {
    const parts = [r.admin1, r.country].filter(Boolean).join(', ');
    return `<div class="suggestion" data-idx="${i}">${r.name}<small>${parts}</small></div>`;
  }).join('');
  suggestionsBox.classList.add('show');
  [...suggestionsBox.querySelectorAll('.suggestion')].forEach((el, i) => {
    el.addEventListener('click', () => {
      suggestionsBox.classList.remove('show');
      searchInput.value = results[i].name;
      loadLocation(results[i]);
    });
  });
}

// ---------------- Data loading ----------------
async function loadLocation(loc){
  APP.innerHTML = '<div class="loading">Loading forecast…</div>';
  selectedDayIdx = 0;
  try{
    const lat = loc.latitude, lon = loc.longitude;
    const fUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
      `&hourly=temperature_2m,apparent_temperature,precipitation_probability,weathercode,windspeed_10m,winddirection_10m,windgusts_10m,visibility,relativehumidity_2m,uv_index,is_day` +
      `&daily=weathercode,temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max` +
      `&wind_speed_unit=mph&timezone=auto&forecast_days=7`;
    const aqUrl = `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}` +
      `&hourly=european_aqi,alder_pollen,birch_pollen,grass_pollen,ragweed_pollen&timezone=auto&forecast_days=1`;

    const [fRes, aqRes] = await Promise.all([fetch(fUrl), fetch(aqUrl).catch(() => null)]);
    const forecast = await fRes.json();
    let aq = null;
    if(aqRes && aqRes.ok){ try{ aq = await aqRes.json(); }catch(e){} }
    if(forecast.error){ throw new Error(forecast.reason || 'Could not load forecast'); }

    currentData = {loc, forecast, aq};
    render();
  }catch(err){
    APP.innerHTML = `<div class="error">Couldn't load the forecast: ${err.message}. Try another location.</div>`;
  }
}

// ---------------- Day summary text ----------------
function buildDaySummary(dayHourIdxs, hourly){
  const dayIdxs = dayHourIdxs.filter(i => hourly.is_day[i] === 1);
  const useIdx = dayIdxs.length ? dayIdxs : dayHourIdxs;
  if(!useIdx.length) return '';
  const codes = useIdx.map(i => wxInfo(hourly.weathercode[i], true).text);
  if(codes.every(c => c === codes[0])) return `${codes[0]}.`;
  // find where it changes and roughly when
  let changeIdx = useIdx.length - 1;
  for(let i=1;i<codes.length;i++){ if(codes[i] !== codes[0]){ changeIdx = i; break; } }
  const t = new Date(hourly.time[useIdx[changeIdx]]);
  const hour = t.getHours();
  let when = 'later';
  if(hour < 9) when = 'early morning';
  else if(hour < 12) when = 'late morning';
  else if(hour < 15) when = 'early afternoon';
  else if(hour < 18) when = 'late afternoon';
  else if(hour < 21) when = 'early evening';
  else when = 'nighttime';
  return `${codes[0]} changing to ${codes[codes.length-1].toLowerCase()} by ${when}.`;
}

// ---------------- Rendering ----------------
function render(){
  const {loc, forecast, aq} = currentData;
  const daily = forecast.daily;
  const hourly = forecast.hourly;
  const hTimes = hourly.time.map(t => new Date(t));
  const dayDates = daily.time.map(t => new Date(t + 'T00:00:00'));

  const parts = [loc.admin1, loc.country].filter(Boolean).join(', ');

  // Group hourly indices by day
  const dayGroups = dayDates.map(d => hTimes.map((t,i)=>({t,i})).filter(o => o.t.toDateString() === d.toDateString()).map(o=>o.i));

  // ----- Day strip -----
  let aqiVal = null, pollenVal = null;
  if(aq && aq.hourly){
    const idx = Math.min(12, aq.hourly.time.length - 1);
    aqiVal = aq.hourly.european_aqi ? aq.hourly.european_aqi[idx] : null;
    const pollens = ['alder_pollen','birch_pollen','grass_pollen','ragweed_pollen']
      .map(k => aq.hourly[k] ? aq.hourly[k][idx] : null).filter(v => v!=null);
    if(pollens.length) pollenVal = Math.max(...pollens);
  }
  const aqi = aqiBand(aqiVal);
  const pollenBand = pollenVal==null ? {label:'-', color:'#999'} :
    (pollenVal<10 ? {label:'L', color:'var(--uv-low)'} : pollenVal<50 ? {label:'M', color:'var(--uv-mod)'} : {label:'H', color:'var(--uv-high)'});

  const chipsHtml = dayDates.map((d, i) => {
    const info = wxInfo(daily.weathercode[i]);
    if(i === selectedDayIdx){
      const sunrise = new Date(daily.sunrise[i]);
      const sunset = new Date(daily.sunset[i]);
      const uv = uvBand(daily.uv_index_max[i]);
      const summary = buildDaySummary(dayGroups[i], hourly);
      return `<div class="detail-panel">
        <div class="dtitle">${fmtDate(d)}</div>
        <div class="dtemps">${Math.round(daily.temperature_2m_max[i])}°<span class="lo">${Math.round(daily.temperature_2m_min[i])}°</span></div>
        <div class="dsummary">${summary}</div>
        <div class="dsun">
          <span>☀ Sunrise: ${sunrise.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</span>
          <span>☾ Sunset: ${sunset.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</span>
        </div>
        <div class="chips">
          <div class="chip"><span class="badge sq" style="background:${uv.color}">${uv.label}</span> UV</div>
          <div class="chip"><span class="badge diamond" style="background:${aqi.color}"><span>${aqi.label}</span></span> Pollution</div>
          <div class="chip"><span class="badge circle" style="background:${pollenBand.color}">${pollenBand.label}</span> Pollen</div>
        </div>
      </div>`;
    }
    return `<div class="day-chip" data-idx="${i}">
      <div class="dname">${i===0 ? 'Today' : fmtDate(d)}</div>
      <div class="dicon">${wxIconSVG(info.icon, 32)}</div>
      <div class="dtemp">${Math.round(daily.temperature_2m_max[i])}° <span class="lo">${Math.round(daily.temperature_2m_min[i])}°</span></div>
    </div>`;
  }).join('');

  APP.innerHTML = `
    <div class="hero-wrap">
      <div class="hero-image">${heroSceneSVG()}</div>
      <h1 class="hero-title">${loc.name}${parts ? ' <span style=\"font-weight:400;font-size:14px;color:var(--ink-soft)\">'+parts+'</span>' : ''}</h1>
    </div>
    <div class="section-label">Forecast days</div>
    <div class="day-strip" id="dayStrip">${chipsHtml}</div>

    <div class="section-label">7 day forecast for ${loc.name}</div>
    <div class="table-wrap">
      <button class="nav-btn prev" id="scrollPrev">‹</button>
      <button class="nav-btn next" id="scrollNext">›</button>
      <div class="table-scroller-outer">
        <div class="table-flex">
          <div class="row-labels-grid">
            <div class="row-label day-banner-row" style="visibility:hidden">day</div>
            <div class="row-label">Weather symbols</div>
            <div class="row-label">Chance of precipitation</div>
            <div class="row-label">Temperature
              <select id="unitTemp"><option value="C">°C</option><option value="F">°F</option></select>
            </div>
            <div class="row-label">Feels like (°${units.temp})</div>
            <div class="row-label">Wind direction/speed
              <select id="unitWind">
                <option value="mph">mph</option><option value="kmh">km/h</option>
                <option value="kn">knots</option><option value="ms">m/s</option><option value="bft">Bft</option>
              </select>
            </div>
            <div class="row-label">Wind gust (${windUnitLabel(units.wind)})</div>
            <div class="row-label">Visibility
              <select id="unitVis"><option value="desc">description</option><option value="km">km</option></select>
            </div>
            <div class="row-label">Humidity</div>
            <div class="row-label">UV</div>
          </div>
          <div class="scroll-outer" id="scrollOuter">
            <div class="hgrid" id="hgrid"></div>
          </div>
        </div>
      </div>
    </div>
  `;

  document.getElementById('unitTemp').value = units.temp;
  document.getElementById('unitWind').value = units.wind;
  document.getElementById('unitVis').value = units.vis;

  buildHourlyGrid(hTimes, hourly, dayDates, dayGroups);

  document.querySelectorAll('.day-chip').forEach(el => {
    el.addEventListener('click', () => {
      selectedDayIdx = parseInt(el.dataset.idx);
      const targetDay = dayGroups[selectedDayIdx][0];
      render();
      requestAnimationFrame(() => scrollToDay(selectedDayIdx));
    });
  });
  const scrollOuter = document.getElementById('scrollOuter');
  document.getElementById('scrollPrev').addEventListener('click', () => scrollOuter.scrollBy({left:-300, behavior:'smooth'}));
  document.getElementById('scrollNext').addEventListener('click', () => scrollOuter.scrollBy({left:300, behavior:'smooth'}));
  document.getElementById('unitTemp').addEventListener('change', e => { units.temp = e.target.value; render(); });
  document.getElementById('unitWind').addEventListener('change', e => { units.wind = e.target.value; render(); });
  document.getElementById('unitVis').addEventListener('change', e => { units.vis = e.target.value; render(); });
}

let dayColStart = [];

function buildHourlyGrid(hTimes, hourly, dayDates, dayGroups){
  const grid = document.getElementById('hgrid');
  dayColStart = [];
  let colCount = 0;
  let html = '';
  dayGroups.forEach((idxs, dIdx) => {
    dayColStart.push(colCount);
    idxs.forEach(i => {
      const info = wxInfo(hourly.weathercode[i], hourly.is_day[i] === 1);
      const uv = uvBand(hourly.uv_index[i]);
      const t = hTimes[i];
      const tempC = hourly.temperature_2m[i];
      const feelsC = hourly.apparent_temperature[i];
      const tempDisp = units.temp === 'F' ? Math.round(toF(tempC)) : Math.round(tempC);
      const feelsDisp = units.temp === 'F' ? Math.round(toF(feelsC)) : Math.round(feelsC);
      const windDisp = mphTo(hourly.windspeed_10m[i], units.wind);
      const gustDisp = mphTo(hourly.windgusts_10m[i], units.wind);
      const visDisp = units.vis === 'km' ? (hourly.visibility[i]/1000).toFixed(0) : visBand(hourly.visibility[i]);
      html += `<div class="col">
        <div class="row hour-head">${t.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false})}</div>
        <div class="row">${wxIconSVG(info.icon,24)}</div>
        <div class="row" style="color:var(--blue)">${hourly.precipitation_probability[i]}%</div>
        <div class="row"><div class="heat-cell" style="background:${heatColor(tempC)}">${tempDisp}°</div></div>
        <div class="row"><div class="heat-cell" style="background:${heatColor(feelsC)}">${feelsDisp}°</div></div>
        <div class="row"><div class="wind-cell">
          <span class="wind-arrow">${windArrowChar(hourly.winddirection_10m[i])}</span>
          <span>${compass(hourly.winddirection_10m[i])}</span>
          <span>${windDisp}</span>
        </div></div>
        <div class="row">${gustDisp}</div>
        <div class="row">${visDisp}</div>
        <div class="row">${hourly.relativehumidity_2m[i]}%</div>
        <div class="row"><span class="uv-pill" style="background:${uv.color}">${hourly.uv_index[i] < 1 ? '-' : Math.round(hourly.uv_index[i])}</span></div>
      </div>`;
      colCount++;
    });
  });
  grid.innerHTML = html;

  // day banners
  const colw = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--colw'));
  const banners = dayGroups.map((idxs, dIdx) => {
    const left = dayColStart[dIdx] * colw;
    const width = idxs.length * colw;
    const label = dIdx === 0 ? `Today (${fmtDateLong(dayDates[dIdx])})` : fmtDateLong(dayDates[dIdx]);
    return `<div class="day-banner" style="left:${left}px;width:${width}px">${label}</div>`;
  }).join('');
  grid.insertAdjacentHTML('beforeend', banners);
}

function scrollToDay(dayIdx){
  const colw = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--colw'));
  const scrollOuter = document.getElementById('scrollOuter');
  if(scrollOuter && dayColStart[dayIdx] != null){
    scrollOuter.scrollTo({left: dayColStart[dayIdx] * colw, behavior:'smooth'});
  }
}

// ---------------- Default location on load ----------------
window.addEventListener('DOMContentLoaded', () => {
  loadLocation({name:'London', admin1:'England', country:'United Kingdom', latitude:51.5074, longitude:-0.1278});
});
</script>
