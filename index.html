<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather</title>
<style>
  :root{
    --ink:#101820;
    --muted:#536475;
    --line:#dcdcdc;
    --panel:#fff;
    --page:#f5f6f7;
    --header:#f3f3f3;
    --blue:#005ea8;
    --sun:#f6a32d;
    --temp-1:#ffc867;
    --temp-2:#ffad4f;
    --temp-3:#ff8e3f;
    --uv-low:#65ad5b;
    --uv-mod:#ffe20a;
    --uv-high:#ef9b32;
    --uv-very:#d9534f;
    --uv-extreme:#8d4cc8;
    --colw:104px;
    --forecast-display-scale:1;
    --font:Arial, "Helvetica Neue", Helvetica, sans-serif;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--page);color:var(--ink);font-family:var(--font)}
  body{font-size:18px}
  a{color:var(--blue)}

  .brand-bar{
    background:#262626;color:#fff;font-weight:700;padding:12px 18px;
    font-size:17px;letter-spacing:.2px;
  }

  .searchbar{position:relative;max-width:1240px;margin:0 auto;padding:16px}
  .searchbar input{
    width:100%;height:50px;border:1px solid #cfd6dc;border-radius:3px;background:#fff;
    padding:0 48px 0 16px;font:inherit;color:var(--ink);
  }
  .searchbar input:focus{outline:3px solid #9cc8e8;outline-offset:0}
  .search-icon{position:absolute;right:32px;top:50%;transform:translateY(-50%);width:22px;height:22px;color:#526271}

  .suggestions{
    position:absolute;left:16px;right:16px;top:68px;background:#fff;border:1px solid #cfd6dc;
    box-shadow:0 10px 28px rgba(0,0,0,.16);max-height:340px;overflow:auto;z-index:60;display:none;
  }
  .suggestions.show{display:block}
  .suggestion{padding:13px 16px;border-bottom:1px solid #e7ecef;cursor:pointer;font-size:16px}
  .suggestion:hover,.suggestion.active{background:#edf5fb}
  .suggestion small{display:block;color:var(--muted);font-size:13px;margin-top:3px}
  .suggestion.current-loc{display:flex;align-items:center;gap:9px;font-weight:700;color:var(--blue)}
  .suggestions-heading{padding:9px 16px 5px;color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase}

  .hero-wrap,.section-label,.table-wrap,footer{max-width:1240px;margin-left:auto;margin-right:auto}
  .hero-wrap{padding:0 16px}
  .hero-title{
    margin:0;background:#fff;border:1px solid #e0e4e7;padding:17px 18px;
    font-size:25px;line-height:1.25;font-weight:700;
  }
  .hero-title span{font-size:15px;font-weight:400;color:var(--muted)}

  .section-label{padding:0 16px;margin-top:18px;margin-bottom:8px;font-size:22px;font-weight:700}

  .day-strip{
    max-width:1240px;margin:0 auto;padding:0 16px 2px;display:flex;gap:10px;overflow-x:auto;
  }
  .detail-panel{
    flex:0 0 330px;background:#fff;border:1px solid #d6dde2;padding:13px 15px;
    display:grid;gap:7px;min-height:142px;
  }
  .detail-panel .dtitle{font-size:21px;font-weight:700}
  .detail-panel .dtemps{font-size:36px;font-weight:700;line-height:1}
  .detail-panel .dtemps .lo{font-size:22px;color:var(--muted);font-weight:400;margin-left:7px}
  .detail-panel .dsummary{font-size:14px;color:#394956;line-height:1.35}
  .detail-panel .dsun{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:13px}
  .chips{display:flex;gap:12px;flex-wrap:wrap}
  .chip{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
  .badge{display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12px}
  .badge.sq{width:22px;height:22px}
  .badge.diamond{width:21px;height:21px;transform:rotate(45deg)}
  .badge.diamond span{transform:rotate(-45deg)}
  .badge.circle{width:22px;height:22px;border-radius:50%}

  .day-chip{
    flex:0 0 112px;border:1px solid #d6dde2;background:#fff;cursor:pointer;
    padding:10px 8px;text-align:center;display:grid;gap:5px;align-content:center;
  }
  .day-chip:hover,.day-chip.selected{background:#edf5fb;border-color:#a7cce5}
  .day-chip .dname{font-size:14px;color:var(--muted)}
  .day-chip .dicon svg{width:34px;height:34px}
  .day-chip .dtemp{font-size:16px}
  .day-chip .lo{color:var(--muted)}

  .table-wrap{padding:0 16px 34px;position:relative}
  .forecast-shell{position:relative;background:#fff;border:1px solid #e5e5e5;overflow:hidden}
  .forecast-scroll{overflow-x:auto;overflow-y:hidden;scrollbar-color:#7f7f7f #f4f4f4;scrollbar-width:thin}
  .forecast-scroll::-webkit-scrollbar{height:14px}
  .forecast-scroll::-webkit-scrollbar-track{background:#f4f4f4}
  .forecast-scroll::-webkit-scrollbar-thumb{background:#7f7f7f;border-radius:8px;border:3px solid #f4f4f4}

  .nav-btn{
    position:absolute;top:462px;transform:translateY(-50%);z-index:20;
    width:86px;height:86px;border:0;border-radius:50%;background:rgba(43,43,43,.62);
    color:#fff;font-size:58px;line-height:1;display:flex;align-items:center;justify-content:center;
    cursor:pointer;padding-bottom:8px;
  }
  .nav-btn.prev{left:5px}
  .nav-btn.next{right:5px}
  .nav-btn:hover{background:rgba(43,43,43,.78)}

  .met-grid{
    display:grid;grid-template-columns:repeat(var(--cols), var(--colw));
    grid-template-rows:
      61px 95px
      45px 82px
      45px 47px
      46px 75px
      46px 75px
      46px 82px
      45px 58px
      45px 58px
      45px 58px
      45px 65px;
    min-width:calc(var(--cols) * var(--colw));position:relative;background:#fff;
  }

  .day-head{
    grid-row:1;background:var(--header);font-size:24px;font-weight:700;
    display:flex;align-items:flex-start;padding:17px 0 0 36px;
  }
  .day-head.is-next{border-left:4px solid #f0f0f0}

  .hour-cell{
    grid-row:2;background:var(--header);border-left:1px solid var(--line);
    border-bottom:1px solid #8b8b8b;display:flex;align-items:flex-end;justify-content:flex-start;
    padding:0 0 15px 20px;font-size:26px;font-weight:400;
  }
  .hour-cell.day-start{border-left:4px solid #f0f0f0}

  .metric-label{
    grid-column:1/-1;border-top:0;background:#fff;z-index:2;display:flex;align-items:center;
    pointer-events:none;
  }
  .metric-label .label-inner{
    position:sticky;left:23px;display:inline-flex;align-items:center;gap:8px;
    font-size:22px;line-height:1;color:#0a0f14;pointer-events:auto;
  }
  .metric-label select{
    font:inherit;font-size:20px;height:34px;padding:1px 30px 1px 8px;border:1px solid #aab0b7;
    border-radius:5px;background:#e9e9ef;color:#111;
  }
  .info-dot{
    width:28px;height:28px;border-radius:50%;background:#8b8f94;color:#fff;
    display:inline-flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;
  }

  .cell{
    border-left:1px solid var(--line);display:flex;align-items:center;justify-content:center;
    font-size:25px;line-height:1.15;text-align:center;min-width:0;
  }
  .cell.day-start{border-left:4px solid #f0f0f0}
  .cell.precip{align-items:flex-start;padding-top:2px}
  .wx-row svg{width:50px;height:50px}

  .temp-cell{align-items:flex-end;padding:0 2px 0}
  .temp-bar{
    width:calc(100% - 4px);height:var(--barh);background:var(--temp-2);
    display:flex;align-items:flex-end;justify-content:center;padding-bottom:12px;
    font-size:26px;color:#000;
  }
  .feels-cell .temp-bar{filter:saturate(.86) brightness(1.02)}

  .wind-cell{flex-direction:column;gap:7px;font-size:23px;line-height:1}
  .wind-top{display:flex;align-items:center;justify-content:center;gap:6px}
  .wind-arrow{
    width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;
    border-bottom:25px solid #4a4a4a;display:inline-block;transform-origin:50% 57%;
  }
  .wind-speed{font-size:26px}

  .uv-badge{
    display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;
    color:#111;font-size:24px;font-weight:400;
  }
  .uv-badge.night{background:#5d5d5d;color:#fff}

  footer{padding:0 16px 36px;font-size:13px;color:var(--muted);line-height:1.45}
  .loading,.error{max-width:1240px;margin:40px auto;padding:0 16px;color:var(--muted);font-size:16px;text-align:center}

  /* The source layout contracts its hourly grid before switching to the phone layout. */
  @media (min-width:721px) and (max-width:1900px){
    :root{--colw:clamp(70px, calc((100vw - 640px) / 12), 104px)}
    .section-label{margin-top:14px;font-size:20px}
    .detail-panel{flex-basis:300px;min-height:132px;padding:11px 13px;gap:5px}
    .detail-panel .dtitle{font-size:19px}
    .detail-panel .dtemps{font-size:32px}
    .detail-panel .dtemps .lo{font-size:19px}
    .day-chip{flex-basis:104px;padding:8px 6px}
    .met-grid{
      grid-template-rows:
        41px 63px
        30px 59px
        29px 28px
        31px 59px
        30px 58px
        30px 59px
        29px 36px
        29px 36px
        28px 29px
        29px 53px;
    }
    .day-head{font-size:19px;padding:13px 0 0 24px}
    .hour-cell{font-size:20px;padding:0 0 12px 14px}
    .metric-label .label-inner{left:16px;gap:7px;font-size:18px}
    .metric-label select{font-size:16px;height:29px;padding-right:24px}
    .info-dot{width:24px;height:24px;font-size:17px}
    .cell{font-size:19px}
    .wx-row svg{width:40px;height:40px}
    .temp-bar{padding-bottom:8px;font-size:20px}
    .wind-cell{gap:5px;font-size:18px}
    .wind-arrow{border-left-width:10px;border-right-width:10px;border-bottom-width:20px}
    .wind-speed{font-size:20px}
    .uv-badge{width:38px;height:38px;font-size:19px}
    .nav-btn{top:295px;width:62px;height:62px;font-size:43px;padding-bottom:6px}
  }

  @media (max-width:720px){
    :root{--colw:88px}
    body{font-size:16px}
    .hero-title{font-size:21px}
    .section-label{font-size:19px}
    .detail-panel{flex-basis:292px}
    .met-grid{
      grid-template-rows:
        54px 82px
        42px 72px
        42px 45px
        44px 69px
        44px 69px
        44px 77px
        42px 54px
        42px 54px
        42px 54px
        42px 60px;
    }
    .day-head{font-size:21px;padding-left:28px}
    .hour-cell{font-size:22px;padding-left:17px}
    .metric-label .label-inner{font-size:19px;left:18px}
    .metric-label select{font-size:17px;height:31px}
    .cell{font-size:21px}
    .wx-row svg{width:43px;height:43px}
    .nav-btn{top:414px;width:62px;height:62px;font-size:43px}
  }

  /* Desktop forecast details use the same fixed rhythm as the legacy Met Office table. */
  @media (min-width:721px){
    .table-wrap{zoom:var(--forecast-display-scale)}
    :root{--colw:70px}
    .met-grid{
      grid-template-rows:
        41px 63px
        30px 59px
        29px 28px
        31px 59px
        30px 58px
        30px 59px
        29px 36px
        29px 36px
        28px 29px
        29px 53px;
    }
    .day-head{font-size:16px;padding:12px 0 0 16px}
    .hour-cell{font-size:16px;line-height:24px;padding:0 0 6px 12px}
    .metric-label .label-inner{left:16px;gap:7px;font-size:14px;line-height:17.5px}
    .metric-label select{font-size:14px;height:29px;padding:1px 24px 1px 7px}
    .info-dot{width:24px;height:24px;font-size:16px}
    .cell{font-size:16px;line-height:24px}
    .cell.precip{padding-top:2px}
    .wx-row svg{width:48px;height:48px}
    .temp-bar{font-size:16px;line-height:24px;padding-bottom:8px}
    .wind-cell{gap:3px;font-size:16px}
    .wind-top{gap:4px}
    .wind-arrow{border-left-width:10px;border-right-width:10px;border-bottom-width:20px}
    .wind-speed{font-size:16px}
    .uv-badge{width:48px;height:48px;font-size:16px}
    .nav-btn{top:295px;width:62px;height:62px;font-size:43px;padding-bottom:6px}
  }
</style>
</head>
<body>
  <div class="brand-bar">Weather</div>

  <div class="searchbar">
    <input id="searchInput" type="text" placeholder="Search for a place" autocomplete="off">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <div id="suggestions" class="suggestions"></div>
  </div>

  <div id="app">
    <div class="loading">Search for a place to see its forecast.</div>
  </div>

  <footer>Weather data from <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a>, sourced from national meteorological services. This is not an official Met Office product.</footer>

<script>
const APP = document.getElementById('app');
const searchInput = document.getElementById('searchInput');
const suggestionsBox = document.getElementById('suggestions');

const LS_UNITS = 'wx_units';
const LS_RECENTS = 'wx_recents';
const LS_LAST_LOCATION = 'wx_last_location';
const MAX_RECENTS = 5;

let selectedDayIdx = 0;
let currentData = null;
let currentDayGroups = [];
let currentDayDates = [];
let dayColStart = [];
let dayColEnd = [];
let scrollSyncTimer = null;

function loadUnits(){
  try{
    const raw = localStorage.getItem(LS_UNITS);
    if(raw) return Object.assign({temp:'C', wind:'kn', vis:'km'}, JSON.parse(raw));
  }catch(e){}
  return {temp:'C', wind:'kn', vis:'km'};
}
let units = loadUnits();
function saveUnits(){
  try{ localStorage.setItem(LS_UNITS, JSON.stringify(units)); }catch(e){}
}
function loadRecents(){
  try{ return JSON.parse(localStorage.getItem(LS_RECENTS) || '[]'); }catch(e){ return []; }
}
function saveRecent(loc){
  try{
    let recents = loadRecents().filter(r => !(r.latitude === loc.latitude && r.longitude === loc.longitude));
    recents.unshift({name:loc.name, admin1:loc.admin1, country:loc.country, latitude:loc.latitude, longitude:loc.longitude});
    localStorage.setItem(LS_RECENTS, JSON.stringify(recents.slice(0, MAX_RECENTS)));
  }catch(e){}
}
function loadLastLocation(){
  try{ return JSON.parse(localStorage.getItem(LS_LAST_LOCATION) || 'null'); }catch(e){ return null; }
}
function saveLastLocation(loc){
  try{
    localStorage.setItem(LS_LAST_LOCATION, JSON.stringify({
      name:loc.name, admin1:loc.admin1, country:loc.country, latitude:loc.latitude, longitude:loc.longitude
    }));
  }catch(e){}
}

function wxInfo(code, isDay){
  const day = isDay !== false;
  const table = {
    0:{text:'Sunny', icon:day?'sun':'moon'},
    1:{text:'Clear', icon:day?'sun':'moon'},
    2:{text:'Partly cloudy', icon:day?'sun-cloud':'moon-cloud'},
    3:{text:'Cloudy', icon:'cloud'},
    45:{text:'Fog', icon:'fog'},
    48:{text:'Freezing fog', icon:'fog'},
    51:{text:'Light drizzle', icon:'drizzle'},
    53:{text:'Drizzle', icon:'drizzle'},
    55:{text:'Heavy drizzle', icon:'drizzle'},
    56:{text:'Freezing drizzle', icon:'drizzle'},
    57:{text:'Freezing drizzle', icon:'drizzle'},
    61:{text:'Light rain', icon:day?'sun-rain':'rain'},
    63:{text:'Rain', icon:'rain'},
    65:{text:'Heavy rain', icon:'rain-heavy'},
    66:{text:'Freezing rain', icon:'rain'},
    67:{text:'Freezing rain', icon:'rain-heavy'},
    71:{text:'Light snow', icon:'snow'},
    73:{text:'Snow', icon:'snow'},
    75:{text:'Heavy snow', icon:'snow'},
    77:{text:'Snow grains', icon:'snow'},
    80:{text:'Light showers', icon:day?'sun-rain':'rain'},
    81:{text:'Showers', icon:'rain'},
    82:{text:'Heavy showers', icon:'rain-heavy'},
    85:{text:'Snow showers', icon:'snow'},
    86:{text:'Heavy snow showers', icon:'snow'},
    95:{text:'Thunderstorm', icon:'storm'},
    96:{text:'Thunderstorm with hail', icon:'storm'},
    99:{text:'Thunderstorm with hail', icon:'storm'}
  };
  return table[code] || {text:'Cloudy', icon:'cloud'};
}

function wxIconSVG(kind, size){
  const s = size || 50;
  const stroke = '#272727';
  const sun = '#f4a329';
  const cloud = `M9.1 35.5h26.6c5 0 8.8-3.3 8.8-7.7 0-4.2-3.5-7.6-8.1-7.6-.8 0-1.6.1-2.3.3-1.8-4.3-6.1-7.2-11-7.2-6.2 0-11.4 4.6-12 10.4h-2c-3.5 0-6.5 2.6-6.5 5.9s3 5.9 6.5 5.9z`;
  const rainLines = `<g stroke="#2f76bd" stroke-width="2.7" stroke-linecap="round"><line x1="15" y1="40" x2="12" y2="47"/><line x1="25" y1="40" x2="22" y2="47"/><line x1="35" y1="40" x2="32" y2="47"/></g>`;
  const snowDots = `<g fill="#7fa4c2"><circle cx="16" cy="43" r="2.2"/><circle cx="26" cy="46" r="2.2"/><circle cx="36" cy="43" r="2.2"/></g>`;
  const icons = {
    sun:`<circle cx="25" cy="25" r="9.5" fill="${sun}" stroke="${stroke}" stroke-width="2.6"/><g stroke="${stroke}" stroke-width="2.6" stroke-linecap="round"><line x1="25" y1="3" x2="25" y2="10"/><line x1="25" y1="40" x2="25" y2="47"/><line x1="3" y1="25" x2="10" y2="25"/><line x1="40" y1="25" x2="47" y2="25"/><line x1="9.5" y1="9.5" x2="14.5" y2="14.5"/><line x1="35.5" y1="35.5" x2="40.5" y2="40.5"/><line x1="9.5" y1="40.5" x2="14.5" y2="35.5"/><line x1="35.5" y1="14.5" x2="40.5" y2="9.5"/></g>`,
    moon:`<path d="M32 8c-7 1.2-12.4 7.4-12.4 14.8 0 8.5 6.9 15.3 15.3 15.3 3.2 0 6.2-1 8.6-2.7-2.4 4.4-7.1 7.4-12.4 7.4-8.4 0-15.2-6.8-15.2-15.3C15.9 18.3 22.7 10.6 32 8z" fill="#fff" stroke="${stroke}" stroke-width="2.8" stroke-linejoin="round"/>`,
    cloud:`<path d="${cloud}" fill="#fff" stroke="${stroke}" stroke-width="2.8" stroke-linejoin="round"/>`,
    'sun-cloud':`<circle cx="18" cy="18" r="8" fill="${sun}" stroke="${stroke}" stroke-width="2.5"/><g stroke="${stroke}" stroke-width="2.3" stroke-linecap="round"><line x1="18" y1="4" x2="18" y2="8"/><line x1="6" y1="18" x2="10" y2="18"/><line x1="9.5" y1="8.5" x2="12.5" y2="11.5"/></g><path d="${cloud}" fill="#fff" stroke="${stroke}" stroke-width="2.8" stroke-linejoin="round"/>`,
    'moon-cloud':`<path d="M20 8c-4.3 1.1-7.5 5-7.5 9.7 0 5.5 4.5 10 10 10 2 0 3.9-.6 5.5-1.6-1.7 3-4.9 5.1-8.6 5.1-5.7 0-10.3-4.6-10.3-10.3C9.1 14.8 13.7 9.6 20 8z" fill="#fff" stroke="${stroke}" stroke-width="2.5" stroke-linejoin="round"/><path d="${cloud}" fill="#fff" stroke="${stroke}" stroke-width="2.8" stroke-linejoin="round"/>`,
    fog:`<path d="${cloud}" fill="#fff" stroke="${stroke}" stroke-width="2.6" stroke-linejoin="round"/><g stroke="#68727b" stroke-width="2.6" stroke-linecap="round"><line x1="7" y1="40" x2="43" y2="40"/><line x1="11" y1="46" x2="39" y2="46"/></g>`,
    drizzle:`<path d="${cloud}" fill="#fff" stroke="${stroke}" stroke-width="2.8" stroke-linejoin="round"/><g stroke="#2f76bd" stroke-width="2.4" stroke-linecap="round"><line x1="18" y1="41" x2="16" y2="46"/><line x1="31" y1="41" x2="29" y2="46"/></g>`,
    rain:`<path d="${cloud}" fill="#fff" stroke="${stroke}" stroke-width="2.8" stroke-linejoin="round"/>${rainLines}`,
    'rain-heavy':`<path d="${cloud}" fill="#fff" stroke="${stroke}" stroke-width="2.8" stroke-linejoin="round"/>${rainLines}<g stroke="#2f76bd" stroke-width="2.7" stroke-linecap="round"><line x1="43" y1="40" x2="40" y2="47"/></g>`,
    'sun-rain':`<circle cx="18" cy="18" r="8" fill="${sun}" stroke="${stroke}" stroke-width="2.5"/><path d="${cloud}" fill="#fff" stroke="${stroke}" stroke-width="2.8" stroke-linejoin="round"/>${rainLines}`,
    snow:`<path d="${cloud}" fill="#fff" stroke="${stroke}" stroke-width="2.8" stroke-linejoin="round"/>${snowDots}`,
    storm:`<path d="${cloud}" fill="#fff" stroke="${stroke}" stroke-width="2.8" stroke-linejoin="round"/><polygon points="26,38 19,50 27,47 24,58 35,42 28,45" fill="#f0c431" stroke="${stroke}" stroke-width="1.8" stroke-linejoin="round"/>`
  };
  return `<svg width="${s}" height="${s}" viewBox="0 0 50 50" aria-hidden="true">${icons[kind] || icons.cloud}</svg>`;
}

function compass(deg){
  const dirs=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
  return dirs[Math.round(deg/22.5) % 16];
}
function fmtDayHeader(d, i){
  if(i === 0) return 'Today';
  if(i === 1) return d.toLocaleDateString('en-GB', {weekday:'long'});
  return d.toLocaleDateString('en-GB', {weekday:'long'});
}
function fmtDate(d){ return d.toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short'}); }
function fmtDateLong(d){ return d.toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'long', year:'numeric'}); }
function toF(c){ return c * 9 / 5 + 32; }
function cFromDisplay(v){ return units.temp === 'F' ? (v - 32) * 5 / 9 : v; }
function mphTo(v, unit){
  switch(unit){
    case 'mph': return Math.round(v);
    case 'kmh': return Math.round(v * 1.60934);
    case 'kn': return Math.round(v * 0.868976);
    case 'ms': return Math.round(v * 0.44704 * 10) / 10;
    case 'bft': return mphToBeaufort(v);
    default: return Math.round(v);
  }
}
function mphToBeaufort(mph){
  const thresholds = [1,4,8,13,19,25,32,39,47,55,64,73];
  for(let i=0;i<thresholds.length;i++){ if(mph < thresholds[i]) return i; }
  return 12;
}
function windUnitLabel(u){ return {mph:'mph', kmh:'km/h', kn:'knots', ms:'m/s', bft:'Bft'}[u] || 'mph'; }
function visBand(meters){
  if(meters >= 40000) return 'E';
  if(meters >= 20000) return 'VG';
  if(meters >= 10000) return 'G';
  if(meters >= 4000) return 'M';
  if(meters >= 1000) return 'P';
  return 'VP';
}
function uvBand(uv){
  if(uv == null || uv < 1) return {label:'-', color:'#5d5d5d', night:true};
  if(uv < 3) return {label:Math.round(uv), color:'var(--uv-low)'};
  if(uv < 6) return {label:Math.round(uv), color:'var(--uv-mod)'};
  if(uv < 8) return {label:Math.round(uv), color:'var(--uv-high)'};
  if(uv < 11) return {label:Math.round(uv), color:'var(--uv-very)'};
  return {label:Math.round(uv), color:'var(--uv-extreme)'};
}
function aqiBand(aqi){
  if(aqi == null) return {label:'-', color:'#888'};
  if(aqi <= 40) return {label:'L', color:'var(--uv-low)'};
  if(aqi <= 80) return {label:'M', color:'var(--uv-mod)'};
  if(aqi <= 100) return {label:'H', color:'var(--uv-high)'};
  return {label:'VH', color:'var(--uv-very)'};
}
function heatColor(t){
  if(t == null) return '#fff';
  if(t < 16) return '#ffd77b';
  if(t < 21) return 'var(--temp-1)';
  if(t < 25) return 'var(--temp-2)';
  return 'var(--temp-3)';
}
function precipText(v){
  if(v == null) return '-';
  if(v < 5) return '<5%';
  return `${Math.round(v / 5) * 5}%`;
}
function parseForecastTimeParts(value){
  const m = /^(\d{4})-(\d{2})-(\d{2})T(\d{2})/.exec(value);
  if(!m) return null;
  return {y:+m[1], mo:+m[2], d:+m[3], h:+m[4]};
}
function localKeyFromParts(p){ return (((p.y * 100 + p.mo) * 100 + p.d) * 100 + p.h); }
function forecastNowKey(timezone){
  const fmt = new Intl.DateTimeFormat('en-GB', {
    timeZone:timezone || Intl.DateTimeFormat().resolvedOptions().timeZone,
    year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', hour12:false
  });
  const parts = Object.fromEntries(fmt.formatToParts(new Date()).map(p => [p.type, p.value]));
  return localKeyFromParts({y:+parts.year, mo:+parts.month, d:+parts.day, h:+parts.hour});
}

const CURRENT_LOC_ICON = `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>`;

let searchTimer = null;
searchInput.addEventListener('input', () => {
  clearTimeout(searchTimer);
  const q = searchInput.value.trim();
  if(q.length < 2){ showDropdownDefault(); return; }
  searchTimer = setTimeout(() => doSearch(q), 250);
});
searchInput.addEventListener('focus', () => {
  if(searchInput.value.trim().length < 2) showDropdownDefault();
});
document.addEventListener('click', e => {
  if(!e.target.closest('.searchbar')) suggestionsBox.classList.remove('show');
});

function showDropdownDefault(){
  const recents = loadRecents();
  let html = `<div class="suggestion current-loc" data-current="1">${CURRENT_LOC_ICON} Use my current location</div>`;
  if(recents.length){
    html += `<div class="suggestions-heading">Recent places</div>`;
    html += recents.map((r,i) => `<div class="suggestion" data-recent-idx="${i}">${r.name}<small>${[r.admin1, r.country].filter(Boolean).join(', ')}</small></div>`).join('');
  }
  suggestionsBox.innerHTML = html;
  suggestionsBox.classList.add('show');
  wireDropdownHandlers(null, recents);
}
async function doSearch(q){
  try{
    const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=8&language=en&format=json`);
    const data = await res.json();
    renderSuggestions(data.results || []);
  }catch(e){ suggestionsBox.classList.remove('show'); }
}
function renderSuggestions(results){
  if(!results.length){ suggestionsBox.classList.remove('show'); return; }
  suggestionsBox.innerHTML = results.map((r,i) => `<div class="suggestion" data-idx="${i}">${r.name}<small>${[r.admin1, r.country].filter(Boolean).join(', ')}</small></div>`).join('');
  suggestionsBox.classList.add('show');
  wireDropdownHandlers(results, null);
}
function wireDropdownHandlers(results, recents){
  suggestionsBox.querySelectorAll('[data-current]').forEach(el => el.addEventListener('click', () => {
    suggestionsBox.classList.remove('show');
    useCurrentLocation();
  }));
  suggestionsBox.querySelectorAll('[data-idx]').forEach(el => el.addEventListener('click', () => {
    const loc = results[parseInt(el.dataset.idx, 10)];
    suggestionsBox.classList.remove('show');
    searchInput.value = loc.name;
    selectLocation(loc);
  }));
  suggestionsBox.querySelectorAll('[data-recent-idx]').forEach(el => el.addEventListener('click', () => {
    const loc = recents[parseInt(el.dataset.recentIdx, 10)];
    suggestionsBox.classList.remove('show');
    searchInput.value = loc.name;
    selectLocation(loc);
  }));
}
function useCurrentLocation(){
  if(!navigator.geolocation){
    APP.innerHTML = '<div class="error">Your browser does not support location detection.</div>';
    return;
  }
  APP.innerHTML = '<div class="loading">Detecting your location...</div>';
  navigator.geolocation.getCurrentPosition(async pos => {
    const {latitude, longitude} = pos.coords;
    let name = 'Current location', admin1 = '', country = '';
    try{
      const res = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${latitude}&longitude=${longitude}&localityLanguage=en`);
      const data = await res.json();
      name = data.city || data.locality || data.principalSubdivision || name;
      admin1 = data.principalSubdivision || '';
      country = data.countryName || '';
    }catch(e){}
    const loc = {name, admin1, country, latitude, longitude};
    searchInput.value = name;
    selectLocation(loc);
  }, () => {
    APP.innerHTML = '<div class="error">Could not get your location. Check the browser location permission and try again.</div>';
  });
}
function selectLocation(loc){
  saveRecent(loc);
  saveLastLocation(loc);
  loadLocation(loc);
}

async function loadLocation(loc){
  APP.innerHTML = '<div class="loading">Loading forecast...</div>';
  selectedDayIdx = 0;
  try{
    const lat = loc.latitude, lon = loc.longitude;
    const fUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
      `&hourly=temperature_2m,apparent_temperature,precipitation_probability,weathercode,windspeed_10m,winddirection_10m,windgusts_10m,visibility,relativehumidity_2m,uv_index,is_day` +
      `&daily=weathercode,temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max` +
      `&wind_speed_unit=mph&timezone=auto&forecast_days=7`;
    const aqUrl = `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}` +
      `&hourly=european_aqi,alder_pollen,birch_pollen,grass_pollen,ragweed_pollen&timezone=auto&forecast_days=1`;
    const [fRes, aqRes] = await Promise.all([fetch(fUrl), fetch(aqUrl).catch(() => null)]);
    const forecast = await fRes.json();
    let aq = null;
    if(aqRes && aqRes.ok){
      try{ aq = await aqRes.json(); }catch(e){}
    }
    if(forecast.error) throw new Error(forecast.reason || 'Could not load forecast');
    currentData = {loc, forecast, aq};
    render();
  }catch(err){
    APP.innerHTML = `<div class="error">Could not load the forecast: ${err.message}. Try another location.</div>`;
  }
}

function buildDaySummary(dayHourIdxs, hourly){
  const useIdx = dayHourIdxs.filter(i => hourly.is_day[i] === 1);
  const idxs = useIdx.length ? useIdx : dayHourIdxs;
  if(!idxs.length) return '';
  const codes = idxs.map(i => wxInfo(hourly.weathercode[i], hourly.is_day[i] === 1).text);
  if(codes.every(c => c === codes[0])) return `${codes[0]}.`;
  let change = 1;
  for(; change<codes.length; change++){ if(codes[change] !== codes[0]) break; }
  const t = new Date(hourly.time[idxs[Math.min(change, idxs.length - 1)]]);
  const hour = t.getHours();
  const when = hour < 9 ? 'early morning' : hour < 12 ? 'late morning' : hour < 15 ? 'early afternoon' : hour < 18 ? 'late afternoon' : hour < 21 ? 'early evening' : 'night';
  return `${codes[0]} changing to ${codes[codes.length - 1].toLowerCase()} by ${when}.`;
}

function render(){
  const {loc, forecast, aq} = currentData;
  const daily = forecast.daily;
  const hourly = forecast.hourly;
  const dayDates = daily.time.map(t => new Date(`${t}T00:00:00`));
  const nowKey = forecastNowKey(forecast.timezone);
  const dayGroups = dayDates.map((d, dIdx) => {
    const dayPrefix = daily.time[dIdx];
    return hourly.time.map((value, i) => ({value, i}))
      .filter(o => o.value.startsWith(dayPrefix))
      .filter(o => {
        if(dIdx !== 0) return true;
        const parts = parseForecastTimeParts(o.value);
        return parts && localKeyFromParts(parts) >= nowKey;
      })
      .map(o => o.i);
  }).filter((idxs, idx) => idxs.length || idx > 0);
  currentDayGroups = dayGroups;
  currentDayDates = dayDates;
  if(selectedDayIdx >= dayGroups.length) selectedDayIdx = 0;

  const parts = [loc.admin1, loc.country].filter(Boolean).join(', ');
  APP.innerHTML = `
    <div class="hero-wrap">
      <h1 class="hero-title">${loc.name}${parts ? ` <span>${parts}</span>` : ''}</h1>
    </div>
    <div class="section-label">Forecast days</div>
    <div class="day-strip" id="dayStrip"></div>
    <div class="section-label">7 day forecast for ${loc.name}</div>
    <div class="table-wrap">
      <button class="nav-btn prev" id="scrollPrev" aria-label="Scroll forecast left">&#8249;</button>
      <button class="nav-btn next" id="scrollNext" aria-label="Scroll forecast right">&#8250;</button>
      <div class="forecast-shell">
        <div class="forecast-scroll" id="forecastScroll">
          <div class="met-grid" id="metGrid"></div>
        </div>
      </div>
    </div>
  `;
  renderDayStrip(aq);
  buildHourlyGrid(hourly, dayDates, dayGroups);
  wireTableControls();
}

function renderDayStrip(aq){
  if(!currentData) return;
  const {forecast} = currentData;
  const daily = forecast.daily;
  const hourly = forecast.hourly;
  const dayDates = currentDayDates;
  let aqiVal = null, pollenVal = null;
  if(aq && aq.hourly){
    const idx = Math.min(12, aq.hourly.time.length - 1);
    aqiVal = aq.hourly.european_aqi ? aq.hourly.european_aqi[idx] : null;
    const pollens = ['alder_pollen','birch_pollen','grass_pollen','ragweed_pollen']
      .map(k => aq.hourly[k] ? aq.hourly[k][idx] : null).filter(v => v != null);
    if(pollens.length) pollenVal = Math.max(...pollens);
  }
  const aqi = aqiBand(aqiVal);
  const pollenBand = pollenVal == null ? {label:'-', color:'#888'} :
    (pollenVal < 10 ? {label:'L', color:'var(--uv-low)'} : pollenVal < 50 ? {label:'M', color:'var(--uv-mod)'} : {label:'H', color:'var(--uv-high)'});
  const dayStrip = document.getElementById('dayStrip');
  if(!dayStrip) return;
  dayStrip.innerHTML = dayDates.map((d, i) => {
    const info = wxInfo(daily.weathercode[i], true);
    if(i === selectedDayIdx){
      const sunrise = new Date(daily.sunrise[i]);
      const sunset = new Date(daily.sunset[i]);
      const uv = uvBand(daily.uv_index_max[i]);
      return `<div class="detail-panel" data-selected-day="${i}">
        <div class="dtitle">${i === 0 ? 'Today' : fmtDate(d)}</div>
        <div class="dtemps">${Math.round(daily.temperature_2m_max[i])}&deg;<span class="lo">${Math.round(daily.temperature_2m_min[i])}&deg;</span></div>
        <div class="dsummary">${buildDaySummary(currentDayGroups[i] || [], hourly)}</div>
        <div class="dsun">
          <span>Sunrise: ${sunrise.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</span>
          <span>Sunset: ${sunset.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</span>
        </div>
        <div class="chips">
          <div class="chip"><span class="badge sq" style="background:${uv.color}">${uv.label}</span> UV</div>
          <div class="chip"><span class="badge diamond" style="background:${aqi.color}"><span>${aqi.label}</span></span> Pollution</div>
          <div class="chip"><span class="badge circle" style="background:${pollenBand.color}">${pollenBand.label}</span> Pollen</div>
        </div>
      </div>`;
    }
    return `<button class="day-chip" data-day-idx="${i}" type="button">
      <span class="dname">${i === 0 ? 'Today' : fmtDate(d)}</span>
      <span class="dicon">${wxIconSVG(info.icon, 34)}</span>
      <span class="dtemp">${Math.round(daily.temperature_2m_max[i])}&deg; <span class="lo">${Math.round(daily.temperature_2m_min[i])}&deg;</span></span>
    </button>`;
  }).join('');
  dayStrip.querySelectorAll('[data-day-idx]').forEach(el => {
    el.addEventListener('click', () => {
      selectedDayIdx = parseInt(el.dataset.dayIdx, 10);
      renderDayStrip(currentData.aq);
      scrollToDay(selectedDayIdx);
    });
  });
  requestAnimationFrame(() => {
    const selected = dayStrip.querySelector('[data-selected-day]');
    if(selected) selected.scrollIntoView({block:'nearest', inline:'start'});
  });
}

function metricLabel(row, html){
  return `<div class="metric-label" style="grid-row:${row}"><span class="label-inner">${html}<span class="info-dot">i</span></span></div>`;
}
function tempBarHeight(value, min, max){
  const span = Math.max(1, max - min);
  const n = Math.max(0, Math.min(1, (value - min) / span));
  return Math.round(51 + n * 22);
}
function cell(row, col, content, className, extraStyle){
  return `<div class="cell ${className || ''}" style="grid-row:${row};grid-column:${col};${extraStyle || ''}">${content}</div>`;
}

function buildHourlyGrid(hourly, dayDates, dayGroups){
  const grid = document.getElementById('metGrid');
  dayColStart = [];
  dayColEnd = [];
  let col = 1;
  let html = '';
  dayGroups.forEach((idxs, dayIdx) => {
    dayColStart[dayIdx] = col - 1;
    dayColEnd[dayIdx] = col - 1 + idxs.length;
    html += `<div class="day-head ${dayIdx ? 'is-next' : ''}" style="grid-column:${col}/span ${idxs.length}">${fmtDayHeader(dayDates[dayIdx], dayIdx)}</div>`;
    idxs.forEach((i, offset) => {
      const isStart = offset === 0 && dayIdx > 0 ? 'day-start' : '';
      const parts = parseForecastTimeParts(hourly.time[i]);
      html += `<div class="hour-cell ${isStart}" style="grid-column:${col + offset}">${String(parts.h).padStart(2, '0')}:00</div>`;
    });
    col += idxs.length;
  });
  const totalCols = col - 1;
  const usedIdxs = dayGroups.flat();
  const temps = usedIdxs.map(i => hourly.temperature_2m[i]).filter(v => v != null);
  const feels = usedIdxs.map(i => hourly.apparent_temperature[i]).filter(v => v != null);
  const tempMin = Math.min(...temps, ...feels);
  const tempMax = Math.max(...temps, ...feels);

  html += metricLabel(3, 'Weather symbols');
  html += metricLabel(5, 'Chance of precipitation');
  html += metricLabel(7, `Temperature <select id="unitTemp"><option value="C">&deg;C</option><option value="F">&deg;F</option></select>`);
  html += metricLabel(9, `Feels like temperature (&deg;${units.temp})`);
  html += metricLabel(11, `Wind direction and speed <select id="unitWind"><option value="mph">mph</option><option value="kmh">km/h</option><option value="kn">knots</option><option value="ms">m/s</option><option value="bft">Bft</option></select>`);
  html += metricLabel(13, `Wind gust (${windUnitLabel(units.wind)})`);
  html += metricLabel(15, `Visibility <select id="unitVis"><option value="desc">description</option><option value="km">km</option></select>`);
  html += metricLabel(17, 'Humidity');
  html += metricLabel(19, 'UV');

  col = 1;
  dayGroups.forEach((idxs, dayIdx) => {
    idxs.forEach((i, offset) => {
      const gridCol = col + offset;
      const start = offset === 0 && dayIdx > 0 ? 'day-start' : '';
      const info = wxInfo(hourly.weathercode[i], hourly.is_day[i] === 1);
      const tempC = hourly.temperature_2m[i];
      const feelsC = hourly.apparent_temperature[i];
      const tempDisp = units.temp === 'F' ? Math.round(toF(tempC)) : Math.round(tempC);
      const feelsDisp = units.temp === 'F' ? Math.round(toF(feelsC)) : Math.round(feelsC);
      const wind = mphTo(hourly.windspeed_10m[i], units.wind);
      const gust = mphTo(hourly.windgusts_10m[i], units.wind);
      const vis = units.vis === 'km' ? Math.round(hourly.visibility[i] / 1000) : visBand(hourly.visibility[i]);
      const uv = uvBand(hourly.uv_index[i]);
      html += cell(4, gridCol, wxIconSVG(info.icon, 50), `wx-row ${start}`);
      html += cell(6, gridCol, precipText(hourly.precipitation_probability[i]), `precip ${start}`);
      html += cell(8, gridCol, `<div class="temp-bar" style="--barh:${tempBarHeight(tempC, tempMin, tempMax)}px;background:${heatColor(tempC)}">${tempDisp}&deg;</div>`, `temp-cell ${start}`);
      html += cell(10, gridCol, `<div class="temp-bar" style="--barh:${tempBarHeight(feelsC, tempMin, tempMax)}px;background:${heatColor(feelsC)}">${feelsDisp}&deg;</div>`, `temp-cell feels-cell ${start}`);
      html += cell(12, gridCol, `<div class="wind-cell"><div class="wind-top"><span class="wind-arrow" style="transform:rotate(${hourly.winddirection_10m[i]}deg)"></span><span>${compass(hourly.winddirection_10m[i])}</span></div><div class="wind-speed">${wind}</div></div>`, `wind-cell ${start}`);
      html += cell(14, gridCol, gust, start);
      html += cell(16, gridCol, vis, start);
      html += cell(18, gridCol, `${hourly.relativehumidity_2m[i]}%`, start);
      html += cell(20, gridCol, `<span class="uv-badge ${uv.night ? 'night' : ''}" style="background:${uv.color}">${uv.label}</span>`, start);
    });
    col += idxs.length;
  });

  grid.style.setProperty('--cols', totalCols);
  grid.innerHTML = html;
  document.getElementById('unitTemp').value = units.temp;
  document.getElementById('unitWind').value = units.wind;
  document.getElementById('unitVis').value = units.vis;
}

function wireTableControls(){
  const scroll = document.getElementById('forecastScroll');
  document.getElementById('scrollPrev').addEventListener('click', () => scroll.scrollBy({left:-Math.round(scroll.clientWidth * 0.82), behavior:'smooth'}));
  document.getElementById('scrollNext').addEventListener('click', () => scroll.scrollBy({left:Math.round(scroll.clientWidth * 0.82), behavior:'smooth'}));
  document.getElementById('unitTemp').addEventListener('change', e => { units.temp = e.target.value; saveUnits(); render(); });
  document.getElementById('unitWind').addEventListener('change', e => { units.wind = e.target.value; saveUnits(); render(); });
  document.getElementById('unitVis').addEventListener('change', e => { units.vis = e.target.value; saveUnits(); render(); });
  scroll.addEventListener('scroll', () => {
    if(scrollSyncTimer) cancelAnimationFrame(scrollSyncTimer);
    scrollSyncTimer = requestAnimationFrame(syncSelectedDayWithScroll);
  }, {passive:true});
}
function scrollToDay(dayIdx){
  const scroll = document.getElementById('forecastScroll');
  const colw = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--colw'));
  if(scroll && dayColStart[dayIdx] != null){
    scroll.scrollTo({left:dayColStart[dayIdx] * colw, behavior:'smooth'});
  }
}
function syncSelectedDayWithScroll(){
  const scroll = document.getElementById('forecastScroll');
  const colw = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--colw'));
  const midpointCol = Math.floor((scroll.scrollLeft + scroll.clientWidth * 0.45) / colw);
  const nextIdx = dayColStart.findIndex((start, idx) => midpointCol >= start && midpointCol < dayColEnd[idx]);
  if(nextIdx >= 0 && nextIdx !== selectedDayIdx){
    selectedDayIdx = nextIdx;
    renderDayStrip(currentData.aq);
  }
}

function syncForecastDisplayScale(){
  // Keep the desktop forecast at a stable physical size across DPI and zoom levels.
  const density = Math.max(1, window.devicePixelRatio || 1);
  const scale = Math.max(0.5, Math.min(1, 1 / density));
  document.documentElement.style.setProperty('--forecast-display-scale', scale.toFixed(3));
}

window.addEventListener('DOMContentLoaded', () => {
  syncForecastDisplayScale();
  const last = loadLastLocation();
  const startLoc = last || {name:'London', admin1:'England', country:'United Kingdom', latitude:51.5074, longitude:-0.1278};
  searchInput.value = startLoc.name;
  loadLocation(startLoc);
});
window.addEventListener('resize', syncForecastDisplayScale);
window.visualViewport?.addEventListener('resize', syncForecastDisplayScale);
</script>
